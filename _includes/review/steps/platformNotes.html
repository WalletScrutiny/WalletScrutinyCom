{% assign platform = include.platform %}

<div class="step operating-system">
  {% include iconClass.html platform=platform %}
  {% if iconName %}{% include icon.html name=iconName class="circle" %}{% else %}<i class="{{iconClass}} circle"></i>{% endif %}
  <div class="title">
    <h3>Platform notes</h3>
    <div class="textbox">
      {{site.data.platformMeta[platform].description | markdownify}}
    </div>
  </div>
  <div class="data">
  </div>
</div>
