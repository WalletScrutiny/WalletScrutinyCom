<div class="step privacy">
  <i class="circle" style="display: flex; align-items: center; justify-content: center;">
    <i class="fas fa-clock-rotate-left" style="z-index: 2; font-size: 22px;"></i>
  </i>
  <div class="title">
    <h3>Released</h3>
    <p>
    {% if page.released %}
    <span>{{ page.released | date_to_long_string: 'ordinal' }}</span>
    {% else %}
     {{ 'We could not determine when this product was originally released.' }}
    {% endif %}
    </p>
  </div>
  <div class="data">
    {% if page.released %}
    <span class="calculate-time-elapsed raw" data="{{ page.released | date: '%s' }}"></span>
    {% endif %}
  </div>
</div>
