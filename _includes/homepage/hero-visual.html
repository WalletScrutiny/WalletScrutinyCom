<div class="hero-visual" id="heroVisual" aria-hidden="true">
  <div class="hero-visual__particles" id="heroVisualParticles"></div>

  <div class="hero-visual__stage">
    <div class="hero-visual__monitor">
      <div class="hero-visual__titlebar">
        <span class="hero-visual__dot hero-visual__dot--close"></span>
        <span class="hero-visual__dot hero-visual__dot--minimize"></span>
        <span class="hero-visual__dot hero-visual__dot--maximize"></span>
        <span class="hero-visual__window-title">wallet-verify</span>
        <span class="hero-visual__status" id="heroVisualStatus">running</span>
      </div>

      <div class="hero-visual__screen" id="heroVisualScreen">
        <div class="hero-visual__scanline"></div>
        <div class="hero-visual__lines-wrap">
          <div class="hero-visual__lines" id="heroVisualLines"></div>
          <span class="hero-visual__cursor" id="heroVisualCursor"></span>
        </div>
        <div class="hero-visual__verdict" id="heroVisualVerdict" hidden>
          <span class="hero-visual__verdict-icon" id="heroVisualVerdictIcon"></span>
          <span class="hero-visual__verdict-label" id="heroVisualVerdictLabel"></span>
          <span class="hero-visual__verdict-detail" id="heroVisualVerdictDetail"></span>
        </div>
      </div>
    </div>
  </div>
</div>
