<div class="site-footer__main">
  <a class="site-footer__brand" href="{{ site.baseurl }}/" aria-label="Wallet Scrutiny home">
    <span class="site-footer__logo" aria-hidden="true"></span>
    <span class="site-footer__name">Wallet Scrutiny</span>
  </a>

  <nav class="site-footer__nav{% if include.is_home %} site-footer__nav--home{% endif %}" aria-label="Footer">
    {% unless include.is_home %}
    <div class="site-footer__actions">
      <a class="site-footer__link site-footer__link--action" href="{{ site.baseurl }}/howtoContributeToWS/">
        <i class="fas fa-hands-helping" aria-hidden="true"></i>
        Contribute
      </a>
      <a class="site-footer__link site-footer__link--action" href="{{ site.baseurl }}/donate/">
        <i class="fas fa-donate" aria-hidden="true"></i>
        Donate
      </a>
    </div>
    {% endunless %}

    <div class="site-footer__social">
      <a class="site-footer__link site-footer__link--icon" href="https://gitlab.com/walletscrutiny/walletScrutinyCom" title="GitLab" aria-label="GitLab">
        <i class="fab fa-gitlab" aria-hidden="true"></i>
      </a>
      <a class="site-footer__link site-footer__link--icon" href="https://discord.gg/yCNdcSJw9k" title="Discord" aria-label="Discord">
        <i class="fab fa-discord" aria-hidden="true"></i>
      </a>
      <a class="site-footer__link site-footer__link--icon" href="https://njump.me/npub1j9kttlc86w63emmldd4h74rekyqpksqup6p9trhp5gjsf374qlyszvuswx" title="Nostr" aria-label="Nostr">
        <span class="site-footer__icon site-footer__icon--nostr" aria-hidden="true"></span>
      </a>
      <a class="site-footer__link site-footer__link--icon" href="https://x.com/WalletScrutiny" title="X" aria-label="X">
        <i class="fab fa-x-twitter" aria-hidden="true"></i>
      </a>
      <a class="site-footer__link site-footer__link--icon" href="mailto:info@WalletScrutiny.com" title="Email" aria-label="Email">
        <i class="fas fa-envelope" aria-hidden="true"></i>
      </a>
    </div>
  </nav>
</div>
