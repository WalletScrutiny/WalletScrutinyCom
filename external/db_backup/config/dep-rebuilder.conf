# Drop-in for the machine that runs the dependency rebuilder (not the build
# server): same script and timer, other user and database. Installed by
# `npm run deploy:db-backup:dep-rebuilder` as
# /etc/systemd/system/walletscrutiny-db-backup.service.d/dep-rebuilder.conf
[Service]
User=dep-rebuilder
Group=dep-rebuilder
Environment=WS_BACKUP_DATABASES=dep-rebuilder=/var/lib/dep-rebuilder/data/dep-rebuilder.db
# Empty first: reset the build server's list. The database is WAL, so sqlite3
# .backup needs its directory writable.
ReadWritePaths=
ReadWritePaths=/var/lib/dep-rebuilder/data
