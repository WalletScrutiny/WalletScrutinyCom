# Old-URL redirects for walletscrutiny.com and beta.walletscrutiny.com.
#
# Each site build ships /redirects.map (generated by _plugins/redirect_map.rb from
# the pages' redirect_from front matter). nginx loads it into a hash table at
# (re)load time, so a deploy must be followed by `nginx -t && nginx -s reload`.
# The included file has to exist before the first reload with this config: deploy
# a site build that contains redirects.map first, then enable this file.
#
# This file belongs at http level: /etc/nginx/conf.d/redirects-maps.conf
# (Debian's nginx.conf includes conf.d/*.conf before sites-enabled/*).

map_hash_max_size 16384;
map_hash_bucket_size 256;

# Normalise the request path to a trailing slash so /android/x and /android/x/
# both hit the same key.
map $uri $ws_key {
    ~^(.*?)/?$ $1/;
}

map $ws_key $ws_redirect_prod {
    default "";
    include /var/www/walletscrutiny.com/redirects.map;
}

map $ws_key $ws_redirect_beta {
    default "";
    include /var/www/beta.walletscrutiny.com/redirects.map;
}
