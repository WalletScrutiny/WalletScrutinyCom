meta: true
short: Defunct!
title: Not functioning anymore
status: The provider went out of business and the product cannot be used anymore.
color: '#d33100'
redflag: false
message: This product went out of business ... or so. Read the analysis for details.
question: Does the provider still exist and is the product still supported?
details: >
  Discontinued products or worse, products of providers that are not active
  anymore, are problematic, especially if they were not formerly reproducible
  and well audited to be self-custodial following open standards. If the
  provider hasn't answered inquiries for a year but their server is still
  running or similar circumstances might get this verdict, too.


  For apps on an app store, 'removed' takes precedence: once the app is gone from
  the store, it is 'removed' and the review mentions the provider's fate in a
  warning. 'Defunct' applies while the product can still be downloaded or bought,
  and to products that are not distributed through a store, such as hardware.


  A device that keeps working without its provider is 'discontinued', not
  'defunct', even when the provider is gone: for example one with a standard
  seed that other wallets restore, one that third-party apps support, or a
  bearer item with its key printed or sealed on it. Hardware is 'defunct' when
  it cannot be used anymore, because it needs the provider's app, server or
  redemption service and those are gone.


  On a 'vapor' product, 'defunct' means the provider is gone, too: what was
  announced as coming will not come, and the announcement is a broken promise.
