short: No Wallet
title: Not a wallet
status: Not a wallet for sending and receiving money.
pass: This is an actual wallet
color: 'var(--indifferent, #3d506d)'
redflag: false
message: This appears to not be a product to receive and send money.
question: Is it a wallet?
details: >
  If it's called "wallet" but is actually only a portfolio tracker, we don't look
  any deeper, assuming it is not meant to control funds. What has no funds, can't
  lose your coins. *It might still leak your financial history!*
  
  
  If you can buy Bitcoins with this app but only into another wallet, it's not
  a wallet itself.


  The same goes for off-ramps that hold no balance at all: bitcoin (or gift
  cards) go in and fiat goes straight out to your bank. An off-ramp that keeps
  your fiat until you cash out is a wallet, just not for Bitcoin. One that keeps
  a bitcoin balance you can't send out is 'Can't send or receive bitcoins'.
