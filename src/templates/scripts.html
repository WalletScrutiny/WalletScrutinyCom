{% include base_path %}

<!-- This file "src/templates/scripts.html" is used to generate the "_includes/scripts.html" file with the
    correct names for the webpack bundles. In the case of the development environment, the bundle names
    are '[name].bundle.min.js', whereas in the production environment, the bundle names are
    '[name].[contenthash].bundle.min.js', so the cache gets invalidated automatically in the browser
    when the js files are updated.

    Do not change the file "_includes/scripts.html" directly. Do the changes on "src/templates/scripts.html"
    instead.
-->

<script type="text/javascript" src="/dist{{'<%= htmlWebpackPlugin.files.js[1] %>' | relative_url }}"></script>

<script>
  // Load verifications_data.bundle.min.js asynchronously and then
  // trigger the verificationsDataLoaded event and load verifications_ui.bundle.min.js,
  // which will trigger the verificationsUILoaded event.
  const verificationsScript = document.createElement('script');

  verificationsScript.onload = () => {
    window.dispatchEvent(new CustomEvent("verificationsDataLoaded"));

    (async function() {
      // Start NDK in parallel; getAllAssetInformation reads IDB first without waiting.
      const ndkConnectPromise = nostrConnect();

      // Load with cache - this will fire the event IMMEDIATELY with cached data
      // then update in background when fresh data arrives
      let loadedFromCache = false;
      window.allAssetInformation = await getAllAssetInformation({
        months: 6,
        onCachedDataLoaded: (cachedData) => {
          console.log('🚀 Cached data loaded immediately!', cachedData);
          loadedFromCache = true;
          window.allAssetInformation = cachedData;
          window.dispatchEvent(new CustomEvent("allAssetInformationLoaded"));
        }
      });

      await ndkConnectPromise.catch(() => {});

      // Now fire the event with fresh data if it wasn't fired before, or if it's the verifiers page
      if (!loadedFromCache || {% if page.url == "/verifiers/" %}true{% else %}false{% endif %}) {
        window.dispatchEvent(new CustomEvent("allAssetInformationLoaded"));
      }
      loadDraftVerificationsNotifications();

      // Start background sync after page is idle
      // Wait 10s on most pages, immediately on verification pages
      {% if page.url contains "/mobile/" or page.url contains "/hardware/" or page.url contains "/desktop/" %}
        backgroundSyncEvents();
      {% else %}
        setTimeout(() => {
          backgroundSyncEvents();
        }, 10000);
      {% endif %}
    })();

    // Load verifications_ui.bundle.min.js asynchronously and then trigger the verificationsUILoaded event
    const verificationsUIScript = document.createElement('script');

    verificationsUIScript.onload = () => {
      window.dispatchEvent(new CustomEvent("verificationsUILoaded"));
    };

    verificationsUIScript.src = '{{ base_path }}/dist/<%= htmlWebpackPlugin.files.js[3] %>';
    document.body.appendChild(verificationsUIScript);
  };

  verificationsScript.src = '{{ base_path }}/dist/<%= htmlWebpackPlugin.files.js[2] %>';
  document.body.appendChild(verificationsScript);
</script>

{% include_cached scripts-base.html %}
<script type="text/javascript" src="{{ base_path }}/dist/<%= htmlWebpackPlugin.files.js[0] %>"></script>
<script type="text/javascript" defer src="{{ base_path }}/dist/<%= htmlWebpackPlugin.files.js[4] %>"></script>

{% if page.url == "/" %}
<script type="text/javascript" src="{{ base_path }}/assets/js/ui-components.js"></script>
<script type="text/javascript" src="{{ base_path }}/assets/js/searchWallets.js"></script>
<script type="text/javascript" src="{{ base_path }}/assets/js/landingPageWalletGrid.js"></script>
{% endif %}

{% unless page.url == "/" %}<script type="text/javascript" defer src="{{ base_path }}/assets/js/searchWallets.js"></script>{% endunless %}
