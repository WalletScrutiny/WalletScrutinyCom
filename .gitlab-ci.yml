stages:
  - test
  - maintenance

default:
  image: node:22

.node-test-rules:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

test:main:
  stage: test
  extends: .node-test-rules
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
  before_script:
    - npm ci
  script:
    - npm test

test:build-server:
  stage: test
  extends: .node-test-rules
  cache:
    - key:
        files:
          - package-lock.json
      paths:
        - node_modules/
    - key:
        files:
          - external/build_server/package-lock.json
      paths:
        - external/build_server/node_modules/
  before_script:
    # build_server imports shared modules from src/, which use root package.json deps
    - npm ci
    - npm ci --prefix external/build_server
  script:
    - npm test --prefix external/build_server

refresh-apps:
  stage: maintenance
  variables:
    LN_KEY: ${BTCPAYSERVER_RO_TOKEN}
  script:
    - apt update
    - apt install -y imagemagick-6.q16 parallel
    - chmod +x ./refresh.sh
    - ./refresh.sh -k $LN_KEY > refresh_output.log
  artifacts:
    paths:
      - refresh_output.log
    expire_in: 1 week
  rules:
    - when: manual
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: always
  allow_failure: true
