name: Bisq2 Reproducible Build (Windows)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Bisq2 version without leading v, e.g. 2.1.11'
        required: true
        type: string
      jdk_version:
        description: 'Unused — JDK is pinned to zulu21.50.19-ca-jdk21.0.11 (non-CRaC). Kept for caller compatibility.'
        required: false
        type: string
        default: '21.0.11'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout Bisq2
        uses: actions/checkout@v4
        with:
          repository: bisq-network/bisq2
          ref: v${{ inputs.version }}
          fetch-depth: 0

      - name: Set deterministic git abbreviation
        shell: bash
        run: git config core.abbrev 10

      - name: Download Zulu JDK 21.0.11 (non-CRaC, pinned)
        shell: bash
        run: |
          curl -fL -o zulu-jdk.zip "https://cdn.azul.com/zulu/bin/zulu21.50.19-ca-jdk21.0.11-win_x64.zip"
          echo "84c73a4dcf8400ac01c1fe2d622cc319199e93c1856c200cb50c1bc16dc7dc97  zulu-jdk.zip" | sha256sum -c -
          mkdir -p "$HOME/zulu-jdk"
          unzip -q zulu-jdk.zip -d "$HOME/zulu-jdk"
          JDK_DIR=$(find "$HOME/zulu-jdk" -maxdepth 1 -type d -name "zulu*" | head -1)
          echo "JAVA_HOME=$JDK_DIR" >> "$GITHUB_ENV"
          echo "$JDK_DIR/bin" >> "$GITHUB_PATH"

      - name: Verify JDK is non-CRaC
        shell: bash
        run: |
          java -version
          if java -version 2>&1 | grep -qi crac; then
            echo "ERROR: CRaC JDK detected; expected standard non-CRaC Zulu"
            exit 1
          fi

      - name: Show Java and Gradle versions
        shell: bash
        run: |
          java -version
          ./gradlew -v

      - name: Build modules
        shell: bash
        run: ./gradlew clean build -x test

      - name: Generate Windows installer
        shell: bash
        run: |
          ./gradlew :apps:desktop:desktop-app-launcher:clean
          ./gradlew :apps:desktop:desktop-app-launcher:generateInstallers

      - name: List generated packages
        shell: bash
        run: ls -lah apps/desktop/desktop-app-launcher/build/packaging/jpackage/packages

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: bisq2-${{ inputs.version }}-win-exe
          path: apps/desktop/desktop-app-launcher/build/packaging/jpackage/packages/*.exe
          if-no-files-found: error
